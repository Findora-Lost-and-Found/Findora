<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190">
  <defs>
    <linearGradient id="bocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6b3c"/>
      <stop offset="100%" stop-color="#0d3f20"/>
    </linearGradient>
    <linearGradient id="bocChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d080"/>
      <stop offset="100%" stop-color="#b89020"/>
    </linearGradient>
  </defs>

  <!-- Card base -->
  <rect width="300" height="190" rx="14" fill="url(#bocBg)"/>

  <!-- Background decorative circles -->
  <circle cx="240" cy="95" r="90" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="42"/>
  <circle cx="282" cy="95" r="90" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="42"/>

  <!-- FINDORA watermark -->
  <text x="150" y="112" font-family="Arial,sans-serif" font-size="36" fill="rgba(255,255,255,0.04)"
        text-anchor="middle" transform="rotate(-22,150,112)" letter-spacing="6">FINDORA</text>

  <!-- Gold top accent strip -->
  <rect x="0" y="0" width="300" height="5" rx="2" fill="#c9a227"/>

  <!-- Bank name -->
  <text x="18" y="27" font-family="Arial,sans-serif" font-size="14" font-weight="bold"
        fill="white" letter-spacing="1">BANK OF CEYLON</text>

  <!-- BOC logo badge (gold) -->
  <circle cx="275" cy="21" r="14" fill="#c9a227"/>
  <text x="275" y="25.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold"
        fill="#0d3f20" text-anchor="middle">BOC</text>

  <!-- EMV Chip -->
  <rect x="18" y="46" width="46" height="36" rx="5" fill="url(#bocChip)"/>
  <line x1="18" y1="64" x2="64" y2="64" stroke="#9a7a10" stroke-width="0.8"/>
  <line x1="35" y1="46" x2="35" y2="82" stroke="#9a7a10" stroke-width="0.8"/>
  <line x1="50" y1="46" x2="50" y2="82" stroke="#9a7a10" stroke-width="0.8"/>
  <rect x="27" y="54" width="22" height="12" rx="2" fill="rgba(0,0,0,0.12)"/>

  <!-- Contactless symbol -->
  <path d="M77 57 Q86 64 77 71" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M81 54 Q93 64 81 74" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M85 51 Q100 64 85 77" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Card number -->
  <text x="18" y="120" font-family="Courier New,monospace" font-size="14" letter-spacing="2.2" fill="white">XXXX  XXXX  XXXX  7832</text>

  <!-- Field labels -->
  <text x="18" y="140" font-family="Arial,sans-serif" font-size="7.2" fill="rgba(255,255,255,0.52)" letter-spacing="0.5">CARD HOLDER</text>
  <text x="165" y="140" font-family="Arial,sans-serif" font-size="7.2" fill="rgba(255,255,255,0.52)" letter-spacing="0.5">VALID THRU</text>

  <!-- Card holder name and expiry -->
  <text x="18" y="156" font-family="Arial,sans-serif" font-size="12" fill="white">S. M. SILVA</text>
  <text x="165" y="156" font-family="Arial,sans-serif" font-size="12" fill="white">12/27</text>

  <!-- Mastercard circles -->
  <circle cx="250" cy="171" r="13" fill="#e63422" opacity="0.88"/>
  <circle cx="266" cy="171" r="13" fill="#f59d00" opacity="0.88"/>
  <text x="258" y="175" font-family="Arial,sans-serif" font-size="5.5" fill="white" text-anchor="middle">MC</text>
</svg>
