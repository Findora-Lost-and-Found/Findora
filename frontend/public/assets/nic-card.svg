    <path d="M 0,162 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0"/>
    <path d="M 0,166 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0"/>
