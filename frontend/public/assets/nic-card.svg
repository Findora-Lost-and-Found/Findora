  <g fill="none" stroke="#3377bb" stroke-width="0.75" opacity="0.3">
    <path d="M 0,150 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0"/>
