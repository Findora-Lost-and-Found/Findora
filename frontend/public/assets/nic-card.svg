    <path d="M 0,182 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0 q 7.5,-3.5 15,0 q 7.5,3.5 15,0"/>
