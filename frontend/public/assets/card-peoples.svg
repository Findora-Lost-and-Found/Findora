<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190">
  <defs>
    <linearGradient id="pbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0121a"/>
      <stop offset="100%" stop-color="#780810"/>
    </linearGradient>
    <linearGradient id="pbChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d080"/>
      <stop offset="100%" stop-color="#b89020"/>
    </linearGradient>
  </defs>

  <!-- Card base -->
  <rect width="300" height="190" rx="14" fill="url(#pbBg)"/>

  <!-- Background decorative circles -->
  <circle cx="240" cy="95" r="90" fill="none" stroke="rgba(255,255,255,0.055)" stroke-width="42"/>
  <circle cx="282" cy="95" r="90" fill="none" stroke="rgba(255,255,255,0.055)" stroke-width="42"/>

  <!-- FINDORA watermark -->
  <text x="150" y="112" font-family="Arial,sans-serif" font-size="36" fill="rgba(255,255,255,0.04)"
        text-anchor="middle" transform="rotate(-22,150,112)" letter-spacing="6">FINDORA</text>

  <!-- Top strip accent -->
  <rect x="0" y="0" width="300" height="4" rx="2" fill="rgba(255,255,255,0.20)"/>

  <!-- Bank name -->
  <text x="18" y="27" font-family="Arial,sans-serif" font-size="15" font-weight="bold"
        fill="white" letter-spacing="1">PEOPLE'S BANK</text>

  <!-- PB logo badge -->
  <circle cx="276" cy="21" r="13" fill="rgba(255,255,255,0.22)"/>
  <text x="276" y="25.5" font-family="Arial,sans-serif" font-size="10" font-weight="bold"
        fill="white" text-anchor="middle">PB</text>

  <!-- EMV Chip -->
  <rect x="18" y="46" width="46" height="36" rx="5" fill="url(#pbChip)"/>
  <line x1="18" y1="64" x2="64" y2="64" stroke="#9a7a10" stroke-width="0.8"/>
  <line x1="35" y1="46" x2="35" y2="82" stroke="#9a7a10" stroke-width="0.8"/>
  <line x1="50" y1="46" x2="50" y2="82" stroke="#9a7a10" stroke-width="0.8"/>
  <rect x="27" y="54" width="22" height="12" rx="2" fill="rgba(0,0,0,0.12)"/>

  <!-- Contactless symbol -->
  <path d="M77 57 Q86 64 77 71" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M81 54 Q93 64 81 74" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M85 51 Q100 64 85 77" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Card number -->
  <text x="18" y="120" font-family="Courier New,monospace" font-size="14" letter-spacing="2.2" fill="white">XXXX  XXXX  XXXX  2867</text>

  <!-- Field labels -->
  <text x="18" y="140" font-family="Arial,sans-serif" font-size="7.2" fill="rgba(255,255,255,0.52)" letter-spacing="0.5">CARD HOLDER</text>
  <text x="165" y="140" font-family="Arial,sans-serif" font-size="7.2" fill="rgba(255,255,255,0.52)" letter-spacing="0.5">VALID THRU</text>

  <!-- Card holder name and expiry -->
  <text x="18" y="156" font-family="Arial,sans-serif" font-size="12" fill="white">A. R. JAYASINGHE</text>
  <text x="165" y="156" font-family="Arial,sans-serif" font-size="12" fill="white">06/27</text>

  <!-- VISA logo -->
  <text x="263" y="176" font-family="Arial,sans-serif" font-size="22" font-style="italic"
        font-weight="bold" fill="white" text-anchor="middle">VISA</text>
</svg>
