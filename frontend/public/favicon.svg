<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="fishGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Magnifying glass handle -->
  <line x1="140" y1="140" x2="175" y2="175" stroke="#001f3f" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Magnifying glass circle -->
  <circle cx="85" cy="85" r="65" fill="none" stroke="#001f3f" stroke-width="10"/>
  
  <!-- Fish body -->
  <ellipse cx="80" cy="85" rx="35" ry="28" fill="url(#fishGradient)"/>
  
  <!-- Fish head/snout -->
  <path d="M 115 75 Q 130 85 115 95" fill="url(#fishGradient)"/>
  
  <!-- Fish tail -->
  <path d="M 45 85 Q 35 70 25 60 Q 35 85 25 110 Q 35 100 45 85" fill="url(#fishGradient)"/>
  
  <!-- Fish fin on top -->
  <path d="M 75 55 Q 85 40 95 50 Q 85 60 75 60" fill="url(#fishGradient)"/>
  
  <!-- Fish eye -->
  <circle cx="100" cy="80" r="4" fill="#ffffff"/>
  <circle cx="101" cy="81" r="2" fill="#001f3f"/>
  
  <!-- Accent curves inside magnifying glass -->
  <path d="M 70 65 Q 75 70 70 75" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
</svg>